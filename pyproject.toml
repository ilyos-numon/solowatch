[project]
name = "solowatch"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "river>=0.22",
    "paho-mqtt>=2.1",
    "supabase>=2.10",
    "apprise>=1.9",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.28.1",
]
viz = ["matplotlib>=3.9", "pillow>=10"]

[project.scripts]
solowatch = "solowatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solowatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --import-mode=importlib"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = false

[[tool.mypy.overrides]]
module = ["river.*", "paho.*", "supabase.*", "apprise.*", "matplotlib.*", "postgrest.*", "gotrue.*"]
ignore_missing_imports = true
