# Mosquitto on the home device (Raspberry Pi OS). Install as /etc/mosquitto/conf.d/solowatch.conf.
# Create the user once: sudo mosquitto_passwd -c /etc/mosquitto/passwd solowatch
# Smart plugs on the home Wi-Fi publish here; nothing is exposed outside the house.
listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
persistence true
