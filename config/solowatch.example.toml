# 홀로안심 가정 내 데몬 설정 예시. 복사해서 config/solowatch.toml 로 쓴다.
# "env:NAME" 은 환경 변수(.env)에서 읽는다. 비밀 값은 이 파일에 쓰지 않는다.

[household]
id = "11111111-1111-4111-8111-111111111111"
slug = "home-demo"
name = "어머니 댁"
install_start = 2026-10-05            # 생략 가능

[mqtt]
host = "localhost"
port = 57883                          # 개발 브로커. 가정 기기에서는 1883 (passwd 파일)
username = ""
password = ""

[store]
path = "data/raw/home.sqlite"

[detector]
learn_days = 14
threshold = 0.995
tick_seconds = 60
daily_report_hour = 20

[supabase]
url = "env:SUPABASE_URL"
anon_key = "env:SUPABASE_ANON_KEY"
device_email = "env:SOLOWATCH_DEVICE_EMAIL"
device_password = "env:SOLOWATCH_DEVICE_PASSWORD"

[apprise]
urls = "env:SOLOWATCH_APPRISE_URLS"    # 비어 있으면 미사용

[[sensor]]
sensor_id = "water_main"
kind = "water"
unit = "L"
min_deviation = 5.0
active_threshold = 0.5
topic = "solowatch/home-demo/water_main/state"

[[sensor]]
sensor_id = "plug_fridge"
kind = "plug"
unit = "W"
min_deviation = 300.0
active_threshold = 1.0
topic = "solowatch/home-demo/plug_fridge/state"

[[sensor]]
sensor_id = "plug_tv"
kind = "plug"
unit = "W"
min_deviation = 300.0
active_threshold = 60.0
topic = "solowatch/home-demo/plug_tv/state"
# Tasmota 예: topic = "tele/tv/SENSOR", value_path = "ENERGY.Power", ts_path = "Time"

[[sensor]]
sensor_id = "plug_light"
kind = "plug"
unit = "W"
min_deviation = 300.0
active_threshold = 30.0
topic = "solowatch/home-demo/plug_light/state"
# Zigbee2MQTT 예: topic = "zigbee2mqtt/living_light", value_path = "power"
